<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img"><title>图4 选定与双方确认时序</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53647b"/></marker></defs><rect width="1000" height="640" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#18283d"><text x="30" y="36" font-size="22" font-weight="bold">图4 选定与双方确认时序</text><rect x="20" y="65" width="170" height="48" rx="5" fill="#f2f6fa" stroke="#8192a9"/><text x="105" y="95" text-anchor="middle" font-size="16">用户 按动作权限</text><path d="M105 115 V590" stroke="#8192a9" stroke-dasharray="5 5"/><rect x="280" y="65" width="170" height="48" rx="5" fill="#f2f6fa" stroke="#8192a9"/><text x="365" y="95" text-anchor="middle" font-size="16">M04交接服务</text><path d="M365 115 V590" stroke="#8192a9" stroke-dasharray="5 5"/><rect x="545" y="65" width="170" height="48" rx="5" fill="#f2f6fa" stroke="#8192a9"/><text x="630" y="95" text-anchor="middle" font-size="16">PostgreSQL</text><path d="M630 115 V590" stroke="#8192a9" stroke-dasharray="5 5"/><rect x="780" y="65" width="170" height="48" rx="5" fill="#f2f6fa" stroke="#8192a9"/><text x="865" y="95" text-anchor="middle" font-size="16">M07 Worker</text><path d="M865 115 V590" stroke="#8192a9" stroke-dasharray="5 5"/><path d="M105 150 H365" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="235.0" y="140" text-anchor="middle" font-size="13">选定申请 + 双version + requestKey</text><path d="M365 205 H630" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="497.5" y="195" text-anchor="middle" font-size="13">锁双记录；插入双占用；RESERVED</text><path d="M630 255 H365" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="497.5" y="245" text-anchor="middle" font-size="13">同事务提交状态 / 幂等 / Outbox</text><path d="M365 305 H105" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="235.0" y="295" text-anchor="middle" font-size="13">返回两侧新version和48小时deadline</text><path d="M105 355 H365" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="235.0" y="345" text-anchor="middle" font-size="13">设置有效公共点；首次确认后刷新version</text><path d="M365 405 H630" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="497.5" y="395" text-anchor="middle" font-size="13">单方确认仅保存标志，两侧version+1</text><path d="M105 455 H365" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="235.0" y="445" text-anchor="middle" font-size="13">第二方以当前version确认</text><path d="M365 505 H630" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="497.5" y="495" text-anchor="middle" font-size="13">双RETURNED + COMPLETED + 释放占用</text><path d="M630 555 H865" stroke="#53647b" stroke-width="2" marker-end="url(#a)"/><text x="747.5" y="545" text-anchor="middle" font-size="13">持久事件：双方归还通知，接收方唯一</text><text x="30" y="620" font-size="14">每次动作实时检查身份、两侧标志、版本和截止；任何失败均不产生半完成。</text></g></svg>