<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title">
<title id="title">图5 记录状态与期限守卫</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53647b"/></marker></defs>
<rect width="1000" height="550" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18283d">
<text x="30" y="36" font-size="22" font-weight="bold">图5 记录状态与期限守卫</text>
<path d="M265 140 L365 140" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="315.0" y="131.0" text-anchor="middle" font-size="13">发布成功</text>
<path d="M605 140 L735 140" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="670.0" y="131.0" text-anchor="middle" font-size="13">原子选定</text>
<path d="M850 180 L850 350" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="856.0" y="256.0" font-size="13">双方确认</text>
<path d="M485 180 L485 350" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="491.0" y="256.0" font-size="13">now≥expiresAt</text>
<path d="M365 165 L147 350" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="256.0" y="248.5" text-anchor="middle" font-size="13">撤回</text>
<path d="M760 180 L550 350" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="655.0" y="256.0" text-anchor="middle" font-size="13">取消/超时且原期限已过</text>
<path d="M735 110 L605 110" stroke="#53647b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="670.0" y="101.0" text-anchor="middle" font-size="13">释放且仍有效</text>
<rect x="30" y="100" width="235" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="147.5" y="127" text-anchor="middle" font-size="17" font-weight="bold">无服务端记录</text>
<text x="147.5" y="151" text-anchor="middle" font-size="14" font-weight="normal">前端DRAFT仅在内存</text>
<rect x="365" y="100" width="240" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="485.0" y="127" text-anchor="middle" font-size="17" font-weight="bold">OPEN</text>
<text x="485.0" y="151" text-anchor="middle" font-size="14" font-weight="normal">有效期30天</text>
<rect x="735" y="100" width="230" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="850.0" y="127" text-anchor="middle" font-size="17" font-weight="bold">RESERVED</text>
<text x="850.0" y="151" text-anchor="middle" font-size="14" font-weight="normal">交接期限48小时</text>
<rect x="735" y="350" width="230" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="850.0" y="377" text-anchor="middle" font-size="17" font-weight="bold">RETURNED</text>
<text x="850.0" y="401" text-anchor="middle" font-size="14" font-weight="normal">双方确认成功</text>
<rect x="365" y="350" width="240" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="485.0" y="377" text-anchor="middle" font-size="17" font-weight="bold">EXPIRED</text>
<text x="485.0" y="401" text-anchor="middle" font-size="14" font-weight="normal">期限到达</text>
<rect x="30" y="350" width="235" height="80" rx="7" fill="#f2f6fa" stroke="#8192a9"/>
<text x="147.5" y="377" text-anchor="middle" font-size="17" font-weight="bold">WITHDRAWN</text>
<text x="147.5" y="401" text-anchor="middle" font-size="14" font-weight="normal">本人撤回</text>
<text x="30" y="503" font-size="14">hidden/frozen为独立标志：禁止普通业务写入，系统时钟与释放不暂停。</text>
<text x="30" y="526" font-size="14">终态不可复活；判断到期使用服务端时间，等于deadline即失效。</text>
</g></svg>